    - >-
      Don't state NICo internals the docs don't state. For RFC 8693 token
      delegation the docs only say per-org settings include delegation,
      `token_endpoint_http_proxy` is an egress proxy for it, and
      `token_endpoint_domain_allowlist` restricts token_endpoint hosts. They
